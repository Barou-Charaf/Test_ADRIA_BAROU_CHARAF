server.port=8080

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=account-rest
spring.cloud.gateway.server.webflux.routes[0].uri=lb://account-servie
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.server.webflux.routes[1].id=transaction-rest
spring.cloud.gateway.server.webflux.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webflux.routes[2].id=account-graphql
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account-servie
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/account/graphql
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/graphql

spring.cloud.gateway.server.webflux.routes[3].id=transaction-graphql
spring.cloud.gateway.server.webflux.routes[3].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/transaction/graphql
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/graphql

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
