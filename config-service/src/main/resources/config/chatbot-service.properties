server.port=8083

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.name=chatbot-service
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.accounts.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.transactions.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.transactions.endpoint=/mcp

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.poll-delay=1000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
