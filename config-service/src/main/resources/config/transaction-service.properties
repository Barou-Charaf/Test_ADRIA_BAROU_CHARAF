server.port=8082

spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

bank.transaction.max-amount=1000

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=transaction-service-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=transaction-service-logger
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.transactionservice.messaging.TransactionCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.transactionservice.messaging

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.cloud.openfeign.client.config.account-servie.connect-timeout=2000
spring.cloud.openfeign.client.config.account-servie.read-timeout=3000
spring.cloud.openfeign.client.config.account-servie.logger-level=basic

resilience4j.circuitbreaker.instances.accountServiceRead.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountServiceRead.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountServiceRead.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountServiceRead.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountServiceWrite.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountServiceWrite.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountServiceWrite.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountServiceWrite.wait-duration-in-open-state=10s
resilience4j.retry.instances.accountServiceRead.max-attempts=3
resilience4j.retry.instances.accountServiceRead.wait-duration=200ms

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
