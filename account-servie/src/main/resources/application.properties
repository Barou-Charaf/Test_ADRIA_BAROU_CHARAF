# Application identity
# Keep this name aligned with the current Maven artifact. It can be renamed to
# "account-service" later when the existing project typo is corrected.
spring.application.name=account-servie
server.port=8081

# Maximum amount accepted by debit and credit operations.
bank.transaction.max-amount=1000

# Run as a standalone service until Config Server is created.
spring.cloud.config.enabled=false

# Run without Eureka/Discovery until the Discovery Server is created.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# Local in-memory database for development
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 browser console: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator health endpoint: http://localhost:8081/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
