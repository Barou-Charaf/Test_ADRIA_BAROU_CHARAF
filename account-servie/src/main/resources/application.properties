spring.application.name=account-servie
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Local fallback used when running an isolated context without Config Server.
bank.transaction.max-amount=1000

# Local MCP fallback when Config Server is not running.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=account-service-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.graphql.graphiql.enabled=true
