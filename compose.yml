name: adria-bank

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  config-service:
    build: ./config-service
    image: adria/config-service:local
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      ACCOUNT_SERVICE_URL: http://account-servie:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

  discovery-service:
    build: ./discovery-service
    image: adria/discovery-service:local
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
    depends_on:
      config-service:
        condition: service_healthy

  account-servie:
    build: ./account-servie
    image: adria/account-servie:local
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    image: adria/transaction-service:local
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-servie:
        condition: service_healthy
      kafka:
        condition: service_healthy

  chatbot-service:
    build: ./chatbot-service
    image: adria/chatbot-service:local
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      ACCOUNT_SERVICE_URL: http://account-servie:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      OPENAI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-servie:
        condition: service_healthy
      transaction-service:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    image: adria/gateway-service:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: adria/frontend:local
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  kafka-data:
